<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学生端 · 实时数字人</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.5/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <div id="particles-js"></div>
  <div class="page-wrap page-wrap--play">
    <div class="container container--play">
      <nav class="nav">
        <a href="/" class="logo"><span class="logo-icon">✦</span><span>实时数字人</span></a>
        <ul class="nav-links">
          <li><a href="/" class="active">学生端</a></li>
          <li><a href="/concurrent">并发联调</a></li>
          <li><a href="/monitor">总控</a></li>
          <li><a href="/admin">管理端</a></li>
        </ul>
      </nav>

      <div class="play-stage">
        <div class="stage-preview" id="stage">
          <video id="idleVideo" muted loop playsinline preload="metadata"></video>
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="stage-overlay" id="stageOverlay">
            <div class="pulse-ring">✦</div>
            <div class="label">等待进入会话</div>
            <div class="hint">选择形象后按住说话</div>
          </div>
        </div>

        <aside class="stage-side">
          <div class="panel ctrl-panel">
            <div class="panel-head">
              <h2>课堂问答</h2>
              <span class="sub">按住说话 / T</span>
            </div>
            <div class="said-chip" id="said"></div>
            <div class="pickers">
              <div class="field">
                <label class="field-label" for="selAvatar">形象</label>
                <select class="form-select" id="selAvatar"></select>
              </div>
              <div class="field">
                <label class="field-label" for="selVoice">音模</label>
                <select class="form-select" id="selVoice"></select>
              </div>
              <div class="field">
                <label class="field-label" for="selAgent">智能体</label>
                <select class="form-select" id="selAgent"></select>
              </div>
            </div>
            <div class="actions" style="margin-top:14px">
              <button class="btn btn-primary" id="btnTalk" type="button" disabled>按住说话 / T</button>
              <button class="btn btn-ghost" id="btnInterrupt" type="button" disabled>停止回答</button>
              <button class="btn btn-ghost" id="btnStart" type="button">进入会话</button>
              <button class="btn btn-danger" id="btnEnd" type="button" disabled>结束会话</button>
            </div>
            <div class="status-grid">
              <div class="stat"><div class="k">状态</div><div class="v live" id="state">待机</div></div>
              <div class="stat"><div class="k">提示</div><div class="v" id="hint">加载选项…</div></div>
            </div>
            <div class="app-log" id="log"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

<script>
const API = location.origin;
let session = null;
let room = null;
let mediaRecorder = null;
let chunks = [];
let polling = null;
let options = null;
let recMaxTimer = null;
let ensureMediaInflight = null; // 单飞：避免并发 ensure 互踢断线
const MAX_REC_MS = 20000; // Paraformer 68M 单段 ≤20s
const talkHold = new Set(); // 按住说话来源（key / ptr:id）

const $ = (id) => document.getElementById(id);
const log = (m) => {
  const el = $('log');
  el.textContent += m + '\n';
  el.scrollTop = el.scrollHeight;
};
const setState = (s, kind) => {
  const el = $('state');
  el.textContent = s;
  el.classList.remove('live', 'warn', 'err');
  el.classList.add(kind || 'live');
};
const setHint = (s) => { $('hint').textContent = s || '—'; };
const setSaid = (s) => { $('said').textContent = s ? ('你说：' + s) : ''; };
const isTalkHolding = () => talkHold.size > 0;
const syncIdleUi = (hint) => {
  if (session) session._state = 'idle';
  if (isTalkHolding()) {
    // 按住中：只同步会话态，别动按钮「录音中」外观
    $('btnInterrupt').disabled = true;
    return;
  }
  setState('待机', 'live');
  setHint(hint || '按住说话提问');
  $('btnInterrupt').disabled = true;
  $('btnTalk').classList.remove('recording');
  setLiveTalk(false);
};

let wantLiveTalk = false;
let liveTalkTimer = null;

function remoteVideoReady() {
  const v = $('remoteVideo');
  return !!(v && v.srcObject && v.videoWidth > 0 && v.readyState >= 2);
}

function setLiveTalk(on) {
  // on=true：显示 WebRTC（Publisher 负责待机正倒放 / 动嘴正倒放）
  // 不再只在 speaking 才切——否则本地 idle.mp4 会一直盖住动嘴推流
  wantLiveTalk = !!on;
  if (liveTalkTimer) {
    clearTimeout(liveTalkTimer);
    liveTalkTimer = null;
  }
  const stage = $('stage');
  const idle = $('idleVideo');
  const remote = $('remoteVideo');
  if (!idle || !stage) return;
  if (remote) remote.style.removeProperty('opacity');
  if (!on) {
    stage.classList.remove('live-talk');
    if (stage.classList.contains('has-idle') && idle.src) {
      try { idle.currentTime = 0; } catch (e) {}
      idle.play().catch(() => {});
    }
    return;
  }
  let tries = 0;
  const trySwitch = () => {
    if (!wantLiveTalk) return;
    try { remote.muted = true; remote.playsInline = true; remote.play(); } catch (e) {}
    if (remoteVideoReady()) {
      stage.classList.add('live-talk');
      liveTalkTimer = window.setTimeout(() => {
        try { idle.pause(); } catch (e) {}
      }, 480);
      return;
    }
    tries += 1;
    if (tries === 8 && session && (!room || !remote.srcObject)) {
      ensureMedia().catch((e) => log('ensureMedia live: ' + e));
    }
    if (tries < 80) liveTalkTimer = window.setTimeout(trySwitch, 120);
  };
  trySwitch();
}

function setIdleVideo(url) {
  const v = $('idleVideo');
  const abs = url.startsWith('http') ? url : (API + url);
  if (v.dataset.src === abs) {
    v.play().catch(() => {});
    return;
  }
  v.dataset.src = abs;
  v.src = abs;
  v.muted = true;
  v.loop = true;
  v.playsInline = true;
  v.play().catch(() => {});
}

function clearIdleVideo() {
  const v = $('idleVideo');
  try { v.pause(); } catch (e) {}
  v.removeAttribute('src');
  v.removeAttribute('data-src');
  v.load();
}

function isUuidish(s) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s || '').trim());
}
function labelAvatar(a) {
  const n = (a.name || '').trim();
  if (n && !isUuidish(n)) return n;
  return '课堂形象';
}

function selectedPayload() {
  const av = options.avatars.find(a => `${a.avatar_id}|${a.version_id}` === $('selAvatar').value);
  if (!av) throw new Error('请选择形象');
  const voice_id = $('selVoice').value;
  const agent_id = $('selAgent').value;
  if (!voice_id) throw new Error('请选择音模');
  if (!agent_id) throw new Error('请选择智能体');
  return {
    student_id: 'student_001',
    avatar_id: av.avatar_id,
    avatar_version_id: av.version_id,
    voice_id,
    agent_id,
  };
}

async function loadOptions() {
  const r = await fetch(API + '/api/v1/options');
  options = await r.json();
  const sa = $('selAvatar');
  const sv = $('selVoice');
  const sg = $('selAgent');
  sa.innerHTML = sv.innerHTML = sg.innerHTML = '';
  for (const a of options.avatars || []) {
    const o = document.createElement('option');
    o.value = `${a.avatar_id}|${a.version_id}`;
    o.textContent = labelAvatar(a);
    if (a.is_default) o.selected = true;
    sa.appendChild(o);
  }
  for (const v of options.voices || []) {
    const o = document.createElement('option');
    o.value = v.voice_id;
    o.textContent = `${v.name || v.voice_id}`;
    if (v.is_default || v.voice_id === options.defaults?.voice_id) o.selected = true;
    sv.appendChild(o);
  }
  for (const g of options.agents || []) {
    const o = document.createElement('option');
    o.value = g.agent_id;
    o.textContent = `${g.name || g.agent_id}`;
    if (g.is_default || g.agent_id === options.defaults?.agent_id) o.selected = true;
    sg.appendChild(o);
  }
  sa.onchange = () => {
    const av = options.avatars.find(a => `${a.avatar_id}|${a.version_id}` === sa.value);
    if (av?.voice_id) {
      const hit = [...sv.options].find(o => o.value === av.voice_id);
      if (hit) sv.value = av.voice_id;
    }
  };
  sa.onchange();
  if (!(options.avatars || []).length) { setState('无形象'); setHint('请先到管理端上传'); }
  else if (!(options.voices || []).length) { setState('无音模'); setHint('请先到管理端上传音模'); }
  else if (!(options.agents || []).length) { setState('无智能体'); setHint('请先添加 Dify Key'); }
  else { setState('待机'); setHint('进入会话或按住说话'); }
}

async function createSession() {
  setState('创建中…');
  setHint('');
  const body = selectedPayload();
  const res = await fetch(API + '/api/v1/sessions', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  session = await res.json();
  setIdleVideo(session.idle_video_url || session.idle_image_url);
  $('stage').classList.add('has-idle');
  setLiveTalk(false);
  const voiceName = (options?.voices || []).find((v) => v.voice_id === session.voice_id)?.name
    || session.voice_id
    || '';
  syncIdleUi((session.agent_name || session.agent_id) + (voiceName ? ' · ' + voiceName : ''));
  setSaid('');
  log(`session=${session.session_id}`);
  setSessionChrome(true);
  startPoll(); // 心跳+状态同步；勿等录音结束才开轮询
}

/** 有会话才允许说话/结束；未进会话强制禁用 */
function setSessionChrome(active) {
  $('btnTalk').disabled = !active;
  $('btnEnd').disabled = !active;
  $('btnStart').disabled = !!active;
  if (!active) {
    $('btnInterrupt').disabled = true;
    $('btnTalk').classList.remove('recording');
  }
}

async function leaveLiveKit() {
  if (!room) return;
  try { await room.disconnect(); } catch (e) {}
  room = null;
  const v = $('remoteVideo');
  if (v) {
    v.srcObject = null;
    // 切勿写内联 opacity：会压过 .live-talk 的 CSS，导致讲话永远切不过去
    v.style.removeProperty('opacity');
  }
  document.querySelectorAll('audio[data-lk-audio="1"]').forEach((a) => {
    try { a.srcObject = null; a.remove(); } catch (e) {}
  });
}

async function ensureMedia() {
  if (!session?.session_id) throw new Error('no session');
  if (ensureMediaInflight) return ensureMediaInflight;
  ensureMediaInflight = (async () => {
    const res = await fetch(API + `/api/v1/sessions/${session.session_id}/media/ensure`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    session.livekit_token = data.livekit_token;
    session.livekit_url = browserLivekitUrl(data.livekit_url);
    session._media_state = data.media_state;
    await joinLiveKit();
  })().finally(() => { ensureMediaInflight = null; });
  return ensureMediaInflight;
}

function browserLivekitUrl(url) {
  try {
    const http = url.replace(/^ws/i, 'http');
    const u = new URL(http);
    u.hostname = location.hostname;
    if (location.protocol === 'https:') {
      u.port = '7443';
      return `wss://${u.host}`;
    }
    if (!u.port) u.port = '7880';
    return `ws://${u.host}`;
  } catch (e) {
    return url;
  }
}

async function joinLiveKit() {
  const LK = window.LivekitClient;
  if (room) {
    try {
      const st = room.state;
      // 已连上 / 连接中：复用，勿因画面未订阅就 disconnect（会 Client initiated disconnect）
      if (LK.ConnectionState) {
        if (st === LK.ConnectionState.Connected || st === LK.ConnectionState.Connecting) return;
      } else if (room.localParticipant) {
        return;
      }
    } catch (e) {}
    await leaveLiveKit();
  }
  room = new LK.Room({ adaptiveStream: false, dynacast: false });
  room.on(LK.RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === 'video') {
      try {
        if (LK.VideoQuality) track.setVideoQuality(LK.VideoQuality.HIGH);
      } catch (e) {}
      const el = $('remoteVideo');
      track.attach(el);
      el.style.removeProperty('opacity');
      el.muted = true;
      el.playsInline = true;
      el.autoplay = true;
      el.play().catch(() => {});
      log('subscribed video');
      setLiveTalk(true);
    } else if (track.kind === 'audio') {
      const a = track.attach();
      a.autoplay = true;
      a.dataset.lkAudio = '1';
      document.body.appendChild(a);
      log('subscribed audio');
    }
  });
  room.on(LK.RoomEvent.Disconnected, () => {
    log('livekit disconnected');
    room = null;
    setLiveTalk(false);
  });
  await room.connect(session.livekit_url, session.livekit_token);
  log('livekit connected');
  // 进房后若已有远端轨（重连场景）
  try {
    room.remoteParticipants.forEach((p) => {
      p.trackPublications.forEach((pub) => {
        if (pub.track && pub.kind === 'video') {
          try {
            if (LK.VideoQuality) pub.track.setVideoQuality(LK.VideoQuality.HIGH);
          } catch (e) {}
          const el = $('remoteVideo');
          pub.track.attach(el);
          el.style.removeProperty('opacity');
          el.muted = true;
          el.play().catch(() => {});
          setLiveTalk(true);
        }
      });
    });
  } catch (e) {}
}

function startPoll() {
  if (polling) return;
  polling = setInterval(async () => {
    if (!session?.session_id) return;
    try {
      const r = await fetch(API + `/api/v1/sessions/${session.session_id}`);
      if (r.status === 404) {
        setState('已失效', 'err');
        setHint('会话已结束，请重新进入会话');
        session = null;
        setSessionChrome(false);
        stopPoll();
        return;
      }
      if (!r.ok) return;
      const j = await r.json();
      session._state = j.state;
      session._media_state = j.media_state;
      // 按住说话期间：服务端仍是 idle，轮询不得把「录音中」按钮/文案改回去
      if (isTalkHolding()) {
        $('btnTalk').classList.add('recording');
        setState('录音中…', 'warn');
        setHint('松开后识别');
        return;
      }
      const stage = j.pipeline_stage || '';
      const map = {
        idle: '待机', recognizing: '识别中…', thinking: stage === 'tts' ? '合成语音中…' : '思考中…',
        speaking: '讲话中', interrupting: '打断中', closed: '已关闭'
      };
      const kind = j.state === 'idle' ? (j.last_error ? 'err' : 'live')
        : ['recognizing', 'thinking', 'speaking', 'interrupting'].includes(j.state) ? 'warn'
        : j.state === 'closed' ? 'err' : 'live';
      setState(map[j.state] || j.state, kind);
      if (j.state === 'idle') setHint(j.last_error || '按住说话提问');
      if (j.state === 'recognizing') setHint('正在识别…');
      if (j.state === 'thinking') {
        setHint(stage === 'tts' ? '正在合成并播放…' : '智能体生成中…');
      }
      if (j.state === 'speaking') setHint('可停止或再次打断');
      if (j.recognized_text) setSaid(j.recognized_text);
      const canInterrupt = ['thinking', 'speaking', 'recognizing'].includes(j.state);
      $('btnInterrupt').disabled = !canInterrupt;
      if (j.state === 'idle') $('btnTalk').classList.remove('recording');
      const needMedia = ['recognizing', 'thinking', 'speaking'].includes(j.state);
      // 有 WebRTC 画面就始终显示推流（含待机帧）；动嘴只靠 Publisher start_talking
      if (j.media_state === 'CLOSED') {
        if (needMedia) {
          if (!session._reensuring) {
            session._reensuring = true;
            ensureMedia()
              .catch((e) => log('ensureMedia pipeline: ' + e))
              .finally(() => { if (session) session._reensuring = false; });
          }
        } else if (room) {
          leaveLiveKit().catch(() => {});
          setLiveTalk(false);
          setHint('媒体已回收，下次自动重连');
        }
      } else if (!room) {
        if (!session._reensuring) {
          session._reensuring = true;
          ensureMedia()
            .catch((e) => log('ensureMedia keep: ' + e))
            .finally(() => { if (session) session._reensuring = false; });
        }
      } else if (remoteVideoReady()) {
        setLiveTalk(true);
      }
      // room 已在但画面未到：等 TrackSubscribed，禁止轮询里反复重连
    } catch (e) {}
  }, 400);
}

let interruptInFlight = null;

function busyAnswerState() {
  return ['thinking', 'speaking', 'recognizing', 'interrupting'].includes(session?._state || '');
}

async function doInterrupt() {
  if (!session) return { ok: false };
  if (interruptInFlight) return interruptInFlight;
  $('btnInterrupt').disabled = true;
  if (!isTalkHolding()) {
    $('btnTalk').classList.remove('recording');
    setState('打断中…', 'warn');
    setHint('正在停止回答…');
  }
  interruptInFlight = (async () => {
    try {
      const res = await fetch(API + `/api/v1/sessions/${session.session_id}/interrupt`, { method: 'POST' });
      const j = await res.json().catch(() => ({}));
      log('interrupt gen=' + (j.generation ?? '?') + ' state=' + (j.state || ''));
      if (session) session._state = j.state || 'idle';
      // 服务端回到 idle 后页面必须同步，不能停在「已打断」
      if (!isTalkHolding()) {
        if (!j.state || j.state === 'idle') syncIdleUi('已停止，可继续按住说话');
        else {
          setState(({ interrupting: '打断中…', speaking: '讲话中', thinking: '思考中…' })[j.state] || j.state, 'warn');
        }
      }
      return j;
    } finally {
      interruptInFlight = null;
    }
  })();
  return interruptInFlight;
}

// 按住说话：多来源引用计数，避免 mouseleave / IME 误触提前提交
let recToken = 0;
let stoppingRec = null;
let bargeInOnly = false; // 播报中点按 T：只打断，短按不录音提交

function typingTarget(el) {
  const tag = (el && el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select' || (el && el.isContentEditable);
}

function beginTalkHold(src) {
  if ($('btnTalk').disabled) return;
  const was = talkHold.size;
  talkHold.add(src);
  if (was !== 0) return;

  // 播报/思考中：按下 T 立刻打断（不等麦克风）
  if (session && busyAnswerState()) {
    bargeInOnly = true;
    setState('打断中…', 'warn');
    setHint('已停止回答，按住可继续提问');
    doInterrupt().catch((e) => log(String(e)));
    // 仍按住则转入录音（抢话）
    window.setTimeout(() => {
      if (!talkHold.has(src) || !talkHold.size) return;
      bargeInOnly = false;
      $('btnTalk').classList.add('recording');
      setState('录音中…', 'warn');
      setHint('松开后识别');
      startRec().catch((err) => log(String(err)));
    }, 280);
    return;
  }

  bargeInOnly = false;
  $('btnTalk').classList.add('recording');
  setState('录音中…', 'warn');
  setHint('松开后识别');
  startRec().catch((err) => log(String(err)));
}

function endTalkHold(src) {
  if (!talkHold.has(src)) return;
  talkHold.delete(src);
  if (talkHold.size !== 0) return;
  if (bargeInOnly && !mediaRecorder) {
    // 短按 T 只打断，不提交空录音
    bargeInOnly = false;
    $('btnTalk').classList.remove('recording');
    return;
  }
  bargeInOnly = false;
  stopRec().catch((err) => log(String(err)));
}

async function startRec() {
  const token = ++recToken;
  if (!session) await createSession();
  startPoll(); // 早开轮询：松手抢跑时也不能丢状态同步/心跳
  if (!talkHold.size || token !== recToken) return;
  // 若仍在回答中（打断尚未完成），再等一拍
  if (busyAnswerState()) {
    await doInterrupt().catch(() => {});
  }
  if (!talkHold.size || token !== recToken) return;
  setState('录音中…', 'warn');
  setHint('松开后识别');
  $('btnTalk').classList.add('recording');
  let mediaOk = false;
  const ensureP = ensureMedia()
    .then(() => { mediaOk = true; })
    .catch((e) => { log('ensureMedia: ' + e); mediaOk = false; });
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $('btnTalk').classList.remove('recording');
    setState('错误');
    setHint('无法打开麦克风');
    throw e;
  }
  if (!talkHold.size || token !== recToken) {
    stream.getTracks().forEach((t) => t.stop());
    $('btnTalk').classList.remove('recording');
    return;
  }
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.start();
  if (recMaxTimer) clearTimeout(recMaxTimer);
  recMaxTimer = window.setTimeout(() => {
    if (!talkHold.size) return;
    setHint('已达 20 秒上限，自动提交');
    for (const s of [...talkHold]) endTalkHold(s);
  }, MAX_REC_MS);
  await ensureP;
  if (token !== recToken) {
    // 松手发生在启动中：stopRec 负责提交；此处只记媒体结果
    if (session) session._mediaOk = mediaOk;
    return;
  }
  if (!talkHold.size) {
    if (session) session._mediaOk = mediaOk;
    return;
  }
  session._mediaOk = mediaOk;
  if (!mediaOk) setHint('媒体未就绪，松开后重试');
}

async function stopRec() {
  if (stoppingRec) return stoppingRec;
  if (talkHold.size) return; // 仍有按住来源
  if (recMaxTimer) { clearTimeout(recMaxTimer); recMaxTimer = null; }
  if (!mediaRecorder) {
    $('btnTalk').classList.remove('recording');
    return;
  }
  const mr = mediaRecorder;
  mediaRecorder = null;
  recToken += 1; // 作废进行中的 startRec
  $('btnTalk').classList.remove('recording');
  setState('上传中…');
  setHint('上传录音…');
  startPoll();
  stoppingRec = (async () => {
    await new Promise((resolve) => {
      mr.onstop = resolve;
      try { mr.stop(); } catch (e) { resolve(); }
      try { mr.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    });
    if (!session) return;
    const blob = new Blob(chunks, { type: 'audio/webm' });
    if (blob.size < 256) {
      setState('待机');
      setHint('录音太短，请按住再说');
      return;
    }
    // 推流与识别解耦：LiveKit 抖动不得拦住 ASR 提交
    if (!session._mediaOk || !room) {
      ensureMedia()
        .then(() => { if (session) session._mediaOk = true; })
        .catch((e) => log('ensureMedia background: ' + e));
    }
    const fd = new FormData();
    fd.append('audio', blob, 'q.webm');
    let res, j;
    try {
      res = await fetch(API + `/api/v1/sessions/${session.session_id}/questions`, {
        method: 'POST', body: fd
      });
      j = await res.json();
    } catch (e) {
      log('questions: ' + e);
      setState('错误');
      setHint('提交失败');
      return;
    }
    if (!res.ok) { log(JSON.stringify(j)); setState('错误'); setHint('提交失败'); return; }
    setSaid(j.recognized_text || '');
    log('识别: ' + (j.recognized_text || '(空)'));
    session._state = j.state || 'thinking';
    setState('思考中…', 'warn');
    setHint('智能体生成中…');
    $('btnInterrupt').disabled = false;
    startPoll(); // 提交后必须靠轮询把 speaking→idle 刷回 UI
  })();
  try { await stoppingRec; } finally { stoppingRec = null; }
}

$('btnStart').onclick = () => createSession().catch(e => { log(String(e)); setState('错误'); });
const btn = $('btnTalk');
// pointer capture：移出按钮也不误停；去掉 mouseleave 提前提交
btn.addEventListener('pointerdown', (e) => {
  if (e.button != null && e.button !== 0) return;
  e.preventDefault();
  try { btn.setPointerCapture(e.pointerId); } catch (err) {}
  beginTalkHold('ptr:' + e.pointerId);
});
btn.addEventListener('pointerup', (e) => {
  e.preventDefault();
  endTalkHold('ptr:' + e.pointerId);
  try { btn.releasePointerCapture(e.pointerId); } catch (err) {}
});
btn.addEventListener('pointercancel', (e) => {
  endTalkHold('ptr:' + e.pointerId);
});
btn.addEventListener('lostpointercapture', (e) => {
  endTalkHold('ptr:' + e.pointerId);
});
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyT') return;
  if (e.repeat || e.isComposing || e.key === 'Process') return;
  if (typingTarget(e.target)) return;
  if ($('btnTalk').disabled) return;
  e.preventDefault();
  beginTalkHold('key');
});
window.addEventListener('keyup', (e) => {
  if (e.code !== 'KeyT') return;
  e.preventDefault();
  endTalkHold('key'); // 物理松开必停；勿因 IME isComposing 吞掉
});
window.addEventListener('blur', () => {
  for (const s of [...talkHold]) endTalkHold(s);
});
$('btnInterrupt').onclick = () => doInterrupt().catch(e => log(String(e)));
setSessionChrome(false);

function stopPoll() {
  if (!polling) return;
  clearInterval(polling);
  polling = null;
}

/** 关页/刷新/结束：立刻通知服务端删会话（幂等）。先清本地 sid，避免重复打。 */
function killSessionOnServer(sid) {
  if (!sid) return;
  const del = API + `/api/v1/sessions/${sid}`;
  const closeUrl = del + '/close';
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(closeUrl, new Blob(['{}'], { type: 'application/json' }));
    }
  } catch (e) {}
  try {
    fetch(del, { method: 'DELETE', keepalive: true });
  } catch (e) {}
  try {
    const x = new XMLHttpRequest();
    x.open('DELETE', del, false);
    x.send(null);
  } catch (e) {}
}

async function endSession(opts) {
  const quiet = !!(opts && opts.quiet);
  if (!session?.session_id) return;
  const sid = session.session_id;
  session = null; // 先摘掉，刷新/pagehide 不会再拿旧 id
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    try {
      mediaRecorder.stream.getTracks().forEach((t) => t.stop());
      mediaRecorder.stop();
    } catch (e) {}
    mediaRecorder = null;
  }
  stopPoll();
  killSessionOnServer(sid);
  await leaveLiveKit().catch(() => {});
  clearIdleVideo();
  $('stage').classList.remove('has-idle', 'live-talk');
  $('remoteVideo').srcObject = null;
  setSessionChrome(false);
  setSaid('');
  if (!quiet) {
    setState('已结束', 'live');
    setHint('会话已关闭，可再次进入会话或按住说话');
    log('session closed ' + sid);
  }
}

$('btnEnd').onclick = () => {
  if (!session?.session_id || $('btnEnd').disabled) return;
  endSession().catch((e) => log(String(e)));
};

function closeSessionOnUnload() {
  if (!session?.session_id) return;
  const sid = session.session_id;
  session = null;
  stopPoll();
  killSessionOnServer(sid);
}

window.addEventListener('pagehide', closeSessionOnUnload);
window.addEventListener('beforeunload', closeSessionOnUnload);

loadOptions().catch(e => { log(String(e)); setState('加载失败'); });
</script>
